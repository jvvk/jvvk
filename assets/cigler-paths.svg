<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(63.64,40.00) scale(0.8727)"><text x="500" y="44" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b655c" >Motzkin paths, horizontal steps weighted by height</text><line x1="80" y1="300" x2="920" y2="300" stroke="#c9d1da" stroke-width="2"/><line x1="100" y1="300" x2="180" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><line x1="180" y1="230" x2="260" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><text x="220.0" y="214" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c1b1a" >c</text><line x1="260" y1="230" x2="340" y2="300" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><line x1="340" y1="300" x2="420" y2="300" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><text x="380.0" y="284" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#b4532a" >c + x</text><line x1="420" y1="300" x2="500" y2="300" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><text x="460.0" y="284" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#b4532a" >c + x</text><line x1="500" y1="300" x2="580" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><line x1="580" y1="230" x2="660" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><text x="620.0" y="214" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c1b1a" >c</text><line x1="660" y1="230" x2="740" y2="160" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><line x1="740" y1="160" x2="820" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><line x1="820" y1="230" x2="900" y2="230" stroke="#2f5d8a" stroke-width="6" stroke-linecap="round"/><text x="860.0" y="214" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c1b1a" >c</text><circle cx="100" cy="300" r="7" fill="#2f5d8a"/><circle cx="180" cy="230" r="7" fill="#2f5d8a"/><circle cx="260" cy="230" r="7" fill="#2f5d8a"/><circle cx="340" cy="300" r="7" fill="#2f5d8a"/><circle cx="420" cy="300" r="7" fill="#2f5d8a"/><circle cx="500" cy="300" r="7" fill="#2f5d8a"/><circle cx="580" cy="230" r="7" fill="#2f5d8a"/><circle cx="660" cy="230" r="7" fill="#2f5d8a"/><circle cx="740" cy="160" r="7" fill="#2f5d8a"/><circle cx="820" cy="230" r="7" fill="#2f5d8a"/><circle cx="900" cy="230" r="7" fill="#2f5d8a"/><text x="500" y="400" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#1c1b1a" >a(n, k): weighted paths of length n from height 0 to height k</text><text x="500" y="462" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="32" font-weight="600" fill="#b4532a" >det( a(i + j, k) ) = det H(k, n)(x), with no c in it</text><text x="500" y="510" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b655c" >for all k and n, as Cigler conjectured</text></g></svg>