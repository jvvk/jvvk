<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(40.00,70.00) scale(1.0000)"><text x="460" y="50" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b655c" >digits only 1 and −1, in base 3:</text><text x="460" y="105" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="30" font-weight="400" fill="#1c1b1a" >1, 2, 4, 5, 7, 11, 13, 14, 16, 20, 22, …</text><text x="460" y="175" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b655c" >never a ratio of two of them:</text><text x="140" y="245" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#b4532a" >4·3ᵏ + 5</text><text x="460" y="245" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#b4532a" >4·3ᵏ − 5</text><text x="780" y="245" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#b4532a" >8·3ᵏ + 7</text><text x="300" y="320" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#b4532a" >8·3ᵏ + 17</text><text x="620" y="320" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#b4532a" >8·3ᵏ − 7</text><text x="460" y="395" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b655c" >for every large k, and 247 is the smallest</text></g></svg>