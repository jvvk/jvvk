<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(40.00,90.00) scale(1.0000)"><text x="460" y="70" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="400" fill="#6b655c" >T(x) = x (x + 1) / 2</text><text x="460" y="175" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="600" fill="#1c1b1a" >T(T(z)) + 1 = (z² − z + 2)(z² + 3z + 4) / 8</text><text x="460" y="270" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="400" fill="#b4532a" >both factors stay irreducible at every level</text><text x="460" y="330" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b655c" >(the proof works modulo 5, along the orbit 3 → 1 → 1)</text></g></svg>