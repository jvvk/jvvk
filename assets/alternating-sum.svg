<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(40.00,80.00) scale(1.0000)"><text x="460" y="120" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="66" font-weight="600" fill="#b4532a" >L(u, a, b, n) ≥ 0</text><text x="460" y="215" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b655c" >L is a positive multiple of the coefficient of wᵃ zᵇ in</text><text x="460" y="280" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="36" fill="#1c1b1a">R<tspan dy="-14" font-size="24">u+1</tspan><tspan dy="14"> (R − 1)</tspan><tspan dy="-14" font-size="24">ν</tspan><tspan dy="14">,   R = 1 / ((1 − z)² − w²)</tspan></text><text x="460" y="350" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b655c" >and every coefficient of that series is nonnegative</text></g></svg>