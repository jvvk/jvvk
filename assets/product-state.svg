<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(40.00,94.23) scale(0.8846)"><circle cx="140" cy="200" r="95" fill="none" stroke="#6b655c" stroke-width="2" stroke-dasharray="6 6"/><circle cx="140.0" cy="105.0" r="12" fill="#b4532a" opacity="1.00"/><circle cx="189.7" cy="119.0" r="8" fill="#b4532a" opacity="0.87"/><circle cx="224.7" cy="156.9" r="8" fill="#b4532a" opacity="0.74"/><circle cx="234.7" cy="207.5" r="8" fill="#b4532a" opacity="0.61"/><circle cx="216.8" cy="255.9" r="8" fill="#b4532a" opacity="0.48"/><circle cx="176.3" cy="287.8" r="8" fill="#b4532a" opacity="0.35"/><text x="140" y="210" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="34" font-weight="600" fill="#b4532a" font-style="italic">a</text><circle cx="430" cy="200" r="95" fill="none" stroke="#6b655c" stroke-width="2" stroke-dasharray="6 6"/><circle cx="430.0" cy="105.0" r="12" fill="#2f5d8a" opacity="1.00"/><circle cx="503.2" cy="139.5" r="8" fill="#2f5d8a" opacity="0.87"/><circle cx="523.3" cy="217.9" r="8" fill="#2f5d8a" opacity="0.74"/><circle cx="475.7" cy="283.3" r="8" fill="#2f5d8a" opacity="0.61"/><circle cx="394.9" cy="288.3" r="8" fill="#2f5d8a" opacity="0.48"/><circle cx="339.6" cy="229.2" r="8" fill="#2f5d8a" opacity="0.35"/><text x="430" y="210" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="34" font-weight="600" fill="#2f5d8a" font-style="italic">b</text><text x="285" y="214" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="40" font-weight="400" fill="#1c1b1a" >⊗</text><text x="285" y="380" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >each factor turns at its own constant rate</text><text x="770" y="170" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="600" fill="#1c1b1a" >a product state that stays</text><text x="770" y="210" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="600" fill="#1c1b1a" >a product state is moved</text><text x="770" y="250" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="600" fill="#1c1b1a" >by a constant local Hamiltonian</text><text x="770" y="320" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="26" font-weight="400" fill="#6b655c" >e⁻ⁱᵗᴴ (a ⊗ b)  =  e⁻ⁱᵗʰᴬ a ⊗ e⁻ⁱᵗʰᴮ b</text></g></svg>