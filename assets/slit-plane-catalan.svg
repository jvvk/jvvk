<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(47.17,40.00) scale(0.9057)"><text x="500" y="44" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="400" fill="#6b655c" >walks that never return to the half-line {(−k, 0) : k ≥ 0}</text><line x1="50" y1="150" x2="50" y2="360" stroke="#d8dee6" stroke-width="1.5"/><line x1="140" y1="150" x2="140" y2="360" stroke="#d8dee6" stroke-width="1.5"/><line x1="230" y1="150" x2="230" y2="360" stroke="#d8dee6" stroke-width="1.5"/><line x1="320" y1="150" x2="320" y2="360" stroke="#d8dee6" stroke-width="1.5"/><line x1="410" y1="150" x2="410" y2="360" stroke="#d8dee6" stroke-width="1.5"/><line x1="20" y1="390" x2="440" y2="390" stroke="#d8dee6" stroke-width="1.5"/><line x1="20" y1="300" x2="440" y2="300" stroke="#d8dee6" stroke-width="1.5"/><line x1="20" y1="210" x2="440" y2="210" stroke="#d8dee6" stroke-width="1.5"/><line x1="20" y1="120" x2="440" y2="120" stroke="#d8dee6" stroke-width="1.5"/><line x1="20" y1="300" x2="230" y2="300" stroke="#b4532a" stroke-width="8"/><polyline points="230,300 320,300 320,210 230,210" fill="none" stroke="#2f5d8a" stroke-width="6"/><circle cx="230" cy="300" r="10" fill="#1c1b1a"/><circle cx="230" cy="210" r="10" fill="#2f5d8a"/><text x="230" y="435" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >n = 1:  ENW, NEW, NWE, NNS</text><text x="700" y="170" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="24" font-weight="400" fill="#1c1b1a" >barred loops = signed Dyck pairs</text><text x="700" y="240" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="24" font-weight="400" fill="#1c1b1a" >cancel the primitive loops</text><text x="700" y="310" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="24" font-weight="400" fill="#1c1b1a" >close the walk by one step</text><text x="700" y="380" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="24" font-weight="400" fill="#1c1b1a" >Σ C₂ₖ C₂ₙ₋₂ₖ  (Shapiro)</text><text x="500" y="500" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="30" font-weight="600" fill="#b4532a" >walks of length 2n + 1 to (0, 1)  =  4ⁿ Cₙ</text></g></svg>