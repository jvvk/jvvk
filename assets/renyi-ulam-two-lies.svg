<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(63.64,40.00) scale(0.8727)"><text x="500" y="44" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="400" fill="#6b655c" >Rényi–Ulam game, up to two lies: a position counts candidates by lies used</text><line x1="440" y1="132" x2="250" y2="218" stroke="#1c1b1a" stroke-width="3"/><line x1="560" y1="132" x2="750" y2="218" stroke="#1c1b1a" stroke-width="3"/><text x="320" y="165" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b655c" >yes</text><text x="680" y="165" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b655c" >no</text><rect x="370.0" y="68" width="260" height="64" rx="12" fill="#ffffff" stroke="#1c1b1a" stroke-width="3"/><text x="500" y="110" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="400" fill="#1c1b1a" >(2a, 2b, 0)</text><rect x="40.0" y="218" width="380" height="64" rx="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="230" y="260" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="400" fill="#1c1b1a" >(a+d, a+b+f−d, b−f)</text><rect x="580.0" y="218" width="380" height="64" rx="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="770" y="260" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="400" fill="#1c1b1a" >(a−d, a+b−f+d, b+f)</text><line x1="270" y1="282" x2="430" y2="368" stroke="#b4532a" stroke-width="3" stroke-dasharray="10 8"/><line x1="730" y1="282" x2="570" y2="368" stroke="#b4532a" stroke-width="3" stroke-dasharray="10 8"/><rect x="310.0" y="368" width="380" height="64" rx="12" fill="#ffffff" stroke="#b4532a" stroke-width="3"/><text x="500" y="410" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="28" font-weight="400" fill="#1c1b1a" >(a, a+b, b): halving</text><text x="500" y="480" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#1c1b1a" >the halving child is the midpoint of every question's two children</text><text x="500" y="520" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#b4532a" >and wins whenever the parent does</text></g></svg>