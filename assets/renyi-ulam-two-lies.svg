<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(55.56,40.00) scale(0.8889)"><text x="500" y="40" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="400" fill="#6b655c" >three lies, a ≈ 2·10²⁶ · a position counts candidates by lies used · 106 questions suffice</text><rect x="335.0" y="70" width="330" height="60" rx="12" fill="#ffffff" stroke="#1c1b1a" stroke-width="3"/><text x="500" y="109" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="26" font-weight="400" fill="#1c1b1a" >(2a, 52, 120, 0)</text><line x1="400" y1="132" x2="220" y2="228" stroke="#1c1b1a" stroke-width="3"/><line x1="590" y1="132" x2="640" y2="228" stroke="#1c1b1a" stroke-width="3"/><line x1="620" y1="132" x2="840" y2="318" stroke="#1c1b1a" stroke-width="3"/><text x="170" y="190" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="600" fill="#b4532a" >halve every class</text><text x="850" y="190" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="600" fill="#2f5d8a" >ask (a, 25, 112, 0)</text><rect x="55.0" y="230" width="330" height="60" rx="12" fill="#ffffff" stroke="#b4532a" stroke-width="3"/><text x="220" y="269" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="26" font-weight="400" fill="#1c1b1a" >(a, a+26, 86, 60)</text><text x="220" y="322" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#b4532a" >either answer: 106 more needed</text><rect x="490.0" y="230" width="300" height="60" rx="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="640" y="269" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="26" font-weight="400" fill="#1c1b1a" >(a, a+25, 139, 8)</text><rect x="690.0" y="320" width="300" height="60" rx="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="840" y="359" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif" font-size="26" font-weight="400" fill="#1c1b1a" >(a, a+27, 33, 112)</text><text x="640" y="412" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#2f5d8a" >each answer: 105 more suffice</text><text x="500" y="470" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#1c1b1a" >with three or more lies, halving every class can cost a question</text><text x="500" y="512" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#b4532a" >with two lies it never does</text></g></svg>