<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><style>.lab{font-family:Menlo,Consolas,monospace;fill:#1c1b1a}.cap{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:600}.cap.small{font-size:22px}.axis{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#6b655c}</style><rect width="1000" height="560" rx="18" fill="#f5f0e6"/><g transform="translate(78.95,40.00) scale(0.8421)"><text x="500" y="44" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="400" fill="#6b655c" >X ~ Bin(10, 3/10):  αᵢ = P(X ≤ m − i) − P(X ≥ m + i),  m = 3</text><line x1="100" y1="300" x2="870" y2="300" stroke="#1c1b1a" stroke-width="2"/><line x1="425.0" y1="90" x2="425.0" y2="440" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 8"/><text x="437.0" y="104" text-anchor="start" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >past i = m</text><rect x="122" y="112.1" width="56" height="187.9" fill="#2f5d8a" opacity="0.55"/><text x="150" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >1</text><rect x="232" y="300.0" width="56" height="5.6" fill="#b4532a" opacity="0.55"/><text x="260" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >2</text><rect x="342" y="300.0" width="56" height="110.8" fill="#b4532a" opacity="0.55"/><text x="370" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >3</text><rect x="452" y="300.0" width="56" height="61.4" fill="#b4532a" opacity="0.55"/><text x="480" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >4</text><rect x="562" y="300.0" width="56" height="9.2" fill="#b4532a" opacity="0.55"/><text x="590" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >5</text><rect x="672" y="300.0" width="56" height="0.8" fill="#b4532a" opacity="0.55"/><text x="700" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >6</text><rect x="782" y="300.0" width="56" height="0.0" fill="#b4532a" opacity="0.55"/><text x="810" y="452" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b655c" >7</text><polyline points="150.0,112.1 260.0,117.7 370.0,228.5 480.0,289.9 590.0,299.1 700.0,300.0 810.0,300.0" fill="none" stroke="#1c1b1a" stroke-width="4"/><circle cx="150.0" cy="112.1" r="7" fill="#1c1b1a"/><circle cx="260.0" cy="117.7" r="7" fill="#1c1b1a"/><circle cx="370.0" cy="228.5" r="7" fill="#1c1b1a"/><circle cx="480.0" cy="289.9" r="7" fill="#1c1b1a"/><circle cx="590.0" cy="299.1" r="7" fill="#1c1b1a"/><circle cx="700.0" cy="300.0" r="7" fill="#1c1b1a"/><circle cx="810.0" cy="300.0" r="7" fill="#1c1b1a"/><text x="500" y="500" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#1c1b1a" >partial sums stay positive and fall to exactly 0 at i = n − m</text><text x="500" y="540" text-anchor="middle" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#b4532a" >so every binomial with integer mean is left-loaded</text></g></svg>